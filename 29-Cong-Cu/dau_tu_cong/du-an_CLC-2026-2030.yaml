      hoàn thành dự án.'
ghi_chu: Nguồn sự thật duy nhất cho các script dựng văn bản (Phiếu trình, QĐ KQLCNT). Sửa ở đây rồi dựng lại; không
  gõ số trực tiếp vào script. Giá trị giá trúng thầu hiện bằng giá gói thầu (đã khớp QĐ 2374, 2375).
